# One-off: check reduceTo under clang-asan with dependencies built from source in the container itself.
# (R-hub's clang-asan job restores a package cache it shares by key prefix with the g++ donttest job, so it
# ends up with Rcpp and RcppParallel built against libstdc++ while the package uses libc++.)
# Run from the Actions tab ("debug-crash" -> Run workflow); delete this file once done.
name: debug-crash

on: workflow_dispatch

jobs:
  clang-asan:
    runs-on: ubuntu-latest
    container: ghcr.io/r-hub/containers/clang-asan:latest
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (cmake for RcppParallel's TBB, libuv for fs), gdb
        run: apt-get update && apt-get install -y gdb cmake libuv1-dev libcurl4-openssl-dev libssl-dev

      - name: Rcpp, RcppParallel and testthat from source, with the container's compilers (no cache)
        run: |
          Rscript -e 'install.packages(c("Rcpp", "RcppParallel", "testthat"), repos = "https://cloud.r-project.org", type = "source", Ncpus = 4)'
          Rscript -e 'for (p in c("Rcpp", "RcppParallel", "testthat")) if (!requireNamespace(p, quietly = TRUE)) stop(p, " is missing")'
          Rscript -e 'cat(system.file(package = "Rcpp"), system.file(package = "RcppParallel"), "\n")'

      - name: Install reduceTo
        run: R CMD INSTALL .

      - name: Run the test suite 5 times under gdb
        run: |
          cat > suite.R <<'EOF'
          library(testthat); library(reduceTo)
          for (pass in 1:5) { cat("===== test suite, pass", pass, "=====\n")
            test_dir("tests/testthat", reporter = "summary", stop_on_failure = FALSE, package = "reduceTo", load_package = "installed") }
          cat("no crash in 5 passes\n")
          EOF
          cat > cmds.gdb <<'EOF'
          set pagination off
          set confirm off
          handle SIGPIPE nostop noprint
          run --vanilla -f suite.R
          echo \n===== backtrace of the crashing thread =====\n
          bt 40
          quit
          EOF
          NOT_CRAN=true R -d gdb --debugger-args="-batch -x cmds.gdb" || true

      - name: R CMD check, as R-hub runs it (sanitizer reports print in the test output)
        run: |
          R CMD build --no-build-vignettes --no-manual .
          NOT_CRAN=true _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual --as-cran reduceTo_*.tar.gz || true
          cat reduceTo.Rcheck/tests/testthat.Rout* 2>/dev/null | grep -E "runtime error|AddressSanitizer|SUMMARY|FAIL|caught segfault" || echo "no sanitizer reports or failures in the test output"
